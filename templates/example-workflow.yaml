apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: pipeline-with-outputs
  namespace: argo
spec:
  entrypoint: pipeline
  serviceAccountName: argo-workflow

  templates:
  - name: pipeline
    steps:
    - - name: generate
        template: generate-numbers
    - - name: process
        template: process-number
        arguments:
          parameters:
            - name: number
              value: "{{item}}"
        withParam: "{{steps.generate.outputs.result}}"
    - - name: finalize
        template: finalize
        arguments:
          parameters:
            - name: summary
              value: "{{steps.process.outputs.parameters.summary}}"

  - name: generate-numbers
    script:
      image: python:3.8
      command: [python]
      source: |
        import json
        print(json.dumps(["A", "B", "C"]))
    outputs:
      result: "{{stdout}}"

  - name: process-number
    inputs:
      parameters:
        - name: number
    script:
      image: alpine:3.18
      command: [sh]
      source: |
        echo "Processed {{inputs.parameters.number}}" > /tmp/result.txt
    outputs:
      parameters:
        - name: summary
          valueFrom:
            path: /tmp/result.txt

  - name: finalize
    inputs:
      parameters:
        - name: summary
    script:
      image: alpine:3.18
      command: [sh]
      source: |
        echo "Final summary: {{inputs.parameters.summary}}"
# trigger deploy
# trigger deploy
