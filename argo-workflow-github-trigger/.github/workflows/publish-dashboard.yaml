name: Publish Argo Dashboard

on:
  workflow_run:
    workflows: ["Submit Argo Workflow"]
    types:
      - completed

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate output data
        run: |
          mkdir -p data
          echo '{ "summary": "Workflow ran successfully", "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'" }' > data/latest.json

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
