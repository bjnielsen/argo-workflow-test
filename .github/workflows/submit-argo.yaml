name: Submit Argo Workflow

on:
  push:
    paths:
      - templates/example-workflow.yaml
      - .github/workflows/submit-argo.yaml

jobs:
  argo-submit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG }}" > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig
          kubectl config get-contexts

      - name: Install Argo CLI
        run: |
          curl -sSfL https://github.com/argoproj/argo-workflows/releases/download/v3.5.7/argo-linux-amd64.zip -o
          argo-linux-amd64.zip
          unzip argo-linux-amd64.zip
          chmod +x argo
          sudo mv argo /usr/local/bin/argo
          argo version

      - name: Submit Argo workflow
        run: |
          export KUBECONFIG=$PWD/kubeconfig
          argo submit templates/example-workflow.yaml -n argo --wait
