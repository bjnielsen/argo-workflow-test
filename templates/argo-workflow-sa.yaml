{{- $namespace := .Values.namespace | default "argo" }}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.workflow.serviceAccountName }}
  namespace: {{ $namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.workflow.serviceAccountName }}-admin
  namespace: {{ $namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.workflow.serviceAccountName }}
    namespace: {{ $namespace }}
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
